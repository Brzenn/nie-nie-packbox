<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>资料预览</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --surface: #fffcf7;
      --ink: #1a1917;
      --muted: #6b6560;
      --line: #ddd6c8;
      --accent: #2d6a4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    header .badge {
      font-size: 11px;
      color: var(--accent);
      background: #e4efe8;
      border: 1px solid #c5dccf;
      border-radius: 999px;
      padding: 2px 8px;
      flex-shrink: 0;
    }
    header a {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    main {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }
    main > * {
      max-width: 1100px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      min-height: 100%;
    }
    iframe, video, audio, img {
      display: block;
      width: 100%;
      border: 0;
      background: #fff;
    }
    iframe { height: calc(100vh - 70px); border: 1px solid var(--line); border-radius: 12px; }
    video { max-height: calc(100vh - 90px); background: #000; border-radius: 12px; }
    img { max-height: calc(100vh - 90px); object-fit: contain; border-radius: 12px; }
    audio { padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    pre.text {
      margin: 0 auto;
      padding: 20px;
      font-family: Consolas, "Cascadia Code", monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 100%;
    }
    article.md {
      padding: 28px 32px 48px;
      line-height: 1.75;
      font-size: 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 100%;
      height: auto;
    }
    article.md h1, article.md h2, article.md h3, article.md h4 {
      line-height: 1.3;
      margin: 1.2em 0 0.6em;
    }
    article.md h1 {
      font-size: 1.75em;
      margin-top: 0;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--line);
    }
    article.md h2 { font-size: 1.35em; }
    article.md h3 { font-size: 1.15em; }
    article.md p { margin: 0.75em 0; }
    article.md ul, article.md ol {
      margin: 0.6em 0;
      padding-left: 1.5em;
    }
    article.md li { margin: 0.25em 0; }
    article.md table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    article.md th, article.md td {
      border: 1px solid var(--line);
      padding: 6px 10px;
      text-align: left;
    }
    article.md h1, article.md h2, article.md h3 { line-height: 1.3; }
    article.md pre {
      background: #eeece5;
      padding: 12px 14px;
      border-radius: 8px;
      overflow: auto;
      font-size: 13px;
    }
    article.md code {
      background: #eeece5;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 0.92em;
    }
    article.md pre code { background: none; padding: 0; }
    article.md blockquote {
      margin: 0;
      padding: 8px 14px;
      border-left: 3px solid var(--accent);
      background: #f0eee7;
      color: var(--muted);
    }
    .state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      padding: 40px;
    }
    .state a { color: var(--accent); }
    .state button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">加载中…</h1>
    <span id="badge" class="badge">…</span>
    <a id="open-raw" href="#" target="_blank" rel="noopener">原始文件</a>
  </header>
  <main id="main"><div class="state">加载中…</div></main>
  <script src="viewer.js"></script>
</body>
</html>
