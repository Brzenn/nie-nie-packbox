<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d6a4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>捏捏资料打包盒 · 手机版</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">成</div>
        <div class="brand-text">
          <h1>捏捏资料打包盒</h1>
          <p>手机版 · 点右侧按钮直接下载</p>
        </div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="搜索课程名…" autocomplete="off" enterkeyhint="search" />
      </div>
    </header>

    <!-- 课程列表：点名称进入，点右侧「下载」整课 ZIP -->
    <section id="view-courses" class="view">
      <div class="list-meta">
        <span id="course-count">加载中…</span>
        <button id="reload-courses" type="button" class="link-btn">刷新</button>
      </div>
      <nav id="course-list" class="course-list" aria-label="课程列表"></nav>
    </section>

    <!-- 课程内文件列表：每个文件 / 文件夹右侧都有下载 -->
    <section id="view-course" class="view hidden">
      <header class="course-bar">
        <button id="btn-back" type="button" class="icon-btn" aria-label="返回">←</button>
        <div class="course-bar-text">
          <h2 id="course-title">课程</h2>
          <p id="course-stats">—</p>
        </div>
      </header>

      <div class="crumb-row">
        <div id="breadcrumbs" class="breadcrumbs"></div>
      </div>

      <div id="file-tree" class="file-tree"></div>
    </section>
  </div>

  <div id="progress-sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <p class="sheet-title">正在打包</p>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="progress-text" class="progress-text">准备中…</p>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
